name: EX3 3Levels - Caller

# Level 1 of 3: caller. Job names reported by GitHub (and sent to ServiceNow) look like:
#   Pipeline / CI / Build, Pipeline / CI / Test, Pipeline / CD / Deploy Dev, Pipeline / CD / Deploy
# Manual trigger only, so it does not create an extra change request on every push.
on:
  workflow_dispatch:

jobs:
  pipeline:
    name: Pipeline
    uses: ./.github/workflows/ex3-3levels-stages.yml
    with:
      # Distinct artifact name: version numbers come from github.run_number (per workflow),
      # so sharing "jfpdemo-app" with the other pipelines causes duplicate-version registrations
      app-name: jfpdemo-app-3levels
      prefix: Pipeline
    secrets:
      SN_INSTANCE_URL: ${{ secrets.SN_INSTANCE_URL }}
      SN_ORCHESTRATION_TOOL_ID: ${{ secrets.SN_ORCHESTRATION_TOOL_ID }}
      SN_DEVOPS_INTEGRATION_TOKEN: ${{ secrets.SN_DEVOPS_INTEGRATION_TOKEN }}
