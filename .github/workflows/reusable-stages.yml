name: Reusable Stages

# Level 2 of 3: splits the pipeline into a CI stage and a CD stage, each a reusable workflow.
on:
  workflow_call:
    inputs:
      app-name:
        type: string
        default: jfpdemo-app
      prefix:
        description: Full name of the calling job, e.g. "Pipeline"
        type: string
        default: Pipeline
    secrets:
      SN_INSTANCE_URL:
        required: true
      SN_ORCHESTRATION_TOOL_ID:
        required: true
      SN_DEVOPS_INTEGRATION_TOKEN:
        required: true

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/reusable-ci.yml
    with:
      app-name: ${{ inputs.app-name }}
      prefix: ${{ inputs.prefix }} / CI
    secrets:
      SN_INSTANCE_URL: ${{ secrets.SN_INSTANCE_URL }}
      SN_ORCHESTRATION_TOOL_ID: ${{ secrets.SN_ORCHESTRATION_TOOL_ID }}
      SN_DEVOPS_INTEGRATION_TOKEN: ${{ secrets.SN_DEVOPS_INTEGRATION_TOKEN }}

  cd:
    name: CD
    needs: ci
    uses: ./.github/workflows/reusable-cd.yml
    with:
      app-name: ${{ inputs.app-name }}
      prefix: ${{ inputs.prefix }} / CD
    secrets:
      SN_INSTANCE_URL: ${{ secrets.SN_INSTANCE_URL }}
      SN_ORCHESTRATION_TOOL_ID: ${{ secrets.SN_ORCHESTRATION_TOOL_ID }}
      SN_DEVOPS_INTEGRATION_TOKEN: ${{ secrets.SN_DEVOPS_INTEGRATION_TOKEN }}
