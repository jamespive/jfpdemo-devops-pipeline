name: EX1 Reusable - Workflow

on:
  workflow_call:
    inputs:
      app-name:
        description: Application name registered as the artifact in ServiceNow
        type: string
        default: jfpdemo-app
      caller-job-name:
        description: Name of the calling job; ServiceNow expects the full "caller / callee" job name
        type: string
        default: Pipeline
    secrets:
      SN_INSTANCE_URL:
        required: true
      SN_ORCHESTRATION_TOOL_ID:
        required: true
      SN_DEVOPS_INTEGRATION_TOKEN:
        required: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package app
        run: |
          mkdir -p dist
          zip -r dist/${{ inputs.app-name }}-${{ github.run_number }}.zip app
      - name: Register artifact in ServiceNow
        uses: ServiceNow/servicenow-devops-register-artifact@v7.1.0
        with:
          devops-integration-token: ${{ secrets.SN_DEVOPS_INTEGRATION_TOKEN }}
          instance-url: ${{ secrets.SN_INSTANCE_URL }}
          tool-id: ${{ secrets.SN_ORCHESTRATION_TOOL_ID }}
          context-github: ${{ toJSON(github) }}
          job-name: ${{ inputs.caller-job-name }} / Build
          artifacts: '[{"name":"${{ inputs.app-name }}","version":"1.0.${{ github.run_number }}","semanticVersion":"1.0.${{ github.run_number }}","repositoryName":"${{ github.repository }}"}]'

  test:
    name: Test
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        run: |
          sh app/hello.sh
          sh app/make-report.sh
      - name: Publish test results to ServiceNow
        uses: ServiceNow/servicenow-devops-test-report@v7.1.0
        with:
          devops-integration-token: ${{ secrets.SN_DEVOPS_INTEGRATION_TOKEN }}
          instance-url: ${{ secrets.SN_INSTANCE_URL }}
          tool-id: ${{ secrets.SN_ORCHESTRATION_TOOL_ID }}
          context-github: ${{ toJSON(github) }}
          job-name: ${{ inputs.caller-job-name }} / Test
          xml-report-filename: test-results.xml

  deploy-dev:
    name: Deploy Dev
    needs: test
    runs-on: ubuntu-latest
    environment: development
    steps:
      # No ServiceNow change step: development deployments do not require a change request
      - name: Deploy to development
        run: echo "Deploying ${{ inputs.app-name }} build ${{ github.run_number }} to development"

  deploy:
    name: Deploy
    needs: deploy-dev
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Request change approval in ServiceNow
        uses: ServiceNow/servicenow-devops-change@v7.1.0
        with:
          devops-integration-token: ${{ secrets.SN_DEVOPS_INTEGRATION_TOKEN }}
          instance-url: ${{ secrets.SN_INSTANCE_URL }}
          tool-id: ${{ secrets.SN_ORCHESTRATION_TOOL_ID }}
          context-github: ${{ toJSON(github) }}
          job-name: ${{ inputs.caller-job-name }} / Deploy
          change-request: '{"setCloseCode":"true","autoCloseChange":true,"attributes":{"assignment_group":"a715cd759f2002002920bde8132e7018","cmdb_ci":{"name": "claude-opus-4-8"},"short_description":"Deploy ${{ inputs.app-name }} run ${{ github.run_number }}","description":"Automated deployment from GitHub Actions","implementation_plan":"Deploy build","backout_plan":"Redeploy previous build","test_plan":"Smoke tests passed"}}'
          interval: '100'
          timeout: '3600'
      - name: Deploy
        run: echo "Deploying ${{ inputs.app-name }} build ${{ github.run_number }}"
