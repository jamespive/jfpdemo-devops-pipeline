name: EX1 Reusable - Caller

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  pipeline:
    name: Pipeline
    uses: ./.github/workflows/ex1-reusable-workflow.yml
    with:
      # Distinct artifact name per pipeline: versions come from github.run_number (per workflow),
      # so sharing one name across pipelines causes duplicate-version registrations
      app-name: jfpdemo-app-reusable
      caller-job-name: Pipeline
    secrets:
      SN_INSTANCE_URL: ${{ secrets.SN_INSTANCE_URL }}
      SN_ORCHESTRATION_TOOL_ID: ${{ secrets.SN_ORCHESTRATION_TOOL_ID }}
      SN_DEVOPS_INTEGRATION_TOKEN: ${{ secrets.SN_DEVOPS_INTEGRATION_TOKEN }}
